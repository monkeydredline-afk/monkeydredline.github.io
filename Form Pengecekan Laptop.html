<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pengecekan Laptop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background-color: #f4f4f4;
        padding: 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .kertas {
        background-color: white;
        padding: 40px;
        border: 1.5px solid #444; 
        max-width: 900px;
        margin: auto;
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    
    table input[type="text"] {
        border: none;
        border-bottom: 1.2px solid #555;
        width: 100%;
        outline: none;
        font-weight: bold;
    }

    .table-tebal {
        border: 1.5px solid #333 !important; 
    }
    .table-tebal thead th {
        border-bottom: 1.5px solid #333 !important; 
        background-color: #f2f2f2 !important;
        color: #000;
        font-weight: 700;
    }
    .table-tebal td, .table-tebal th {
        border: 1.2px solid #666 !important; 
    }

    .item {
        text-align: left;
        padding-left: 10px !important;
        font-weight: 500;
    }
    .cek a {
        text-decoration: none;
        font-size: 10px;
        color: #0d6efd;
    }
    .ket {
        border: none !important;
        outline: none;
        width: 100%;
        font-size: 12px;
    }
    textarea {
        width: 100%;
        border: 1.5px solid #444;
        margin-top: 5px;
        padding: 10px;
    }
    
    .form-check-input {
        border: 1.2px solid #333; 
    }

    @media print {
        body { background: none; padding: 0; }
        .kertas { border: none; box-shadow: none; width: 100%; max-width: 100%; padding: 10px; }
        .d-print-none { display: none; }
        .cek { display: none; }
        .table-tebal thead th { background-color: #eee !important; -webkit-print-color-adjust: exact; }
    }
</style>
</head>
<body>

<div class="kertas mt-3" id="print">
    <h4 class="text-center fw-bold mb-1">FORM PENGECEKAN LAPTOP</h4>
    <p class="text-center mb-4" style="font-size: 12px; letter-spacing: 2px;">WANA SATRIA KOMPUTINDO</p>

    <table class="mb-4">
        <tbody>
            <tr>
                <td width="150px" class="fw-bold">Checker</td>
                <td width="15px">:</td>
                <td width="250px"><input type="text"></td>
            </tr>
            <tr>
                <td class="fw-bold">Tanggal</td>
                <td>
