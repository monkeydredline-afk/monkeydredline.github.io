<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tools Teknisi v2.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        /* --- Reset & Base Style --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f0f4f8; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #2b5dbb 0%, #3b71ed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .menu-item {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            border-radius: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .item-blue {
            background: linear-gradient(135deg, #4481eb 0%, #04befe 100%);
            box-shadow: 0 6px 15px rgba(68, 129, 235, 0.2);
        }

        .item-dark-blue {
            background: linear-gradient(135deg, #1a4a9c 0%, #3b71ed 100%);
            grid-column: span 2;
        }

        .menu-item:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .menu-item i { font-size: 36px; color: rgba(255,255,255,0.8); margin-bottom: 12px; }
        .menu-item span { font-size: 16px; font-weight: 600; color: white; }

        /* --- Style Tambahan untuk Link Google Sheets (Dropdown) --- */
        .sheets-wrapper {
            grid-column: span 1; /* Pastikan tetap di grid */
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sub-links {
            display: none; /* Tersembunyi secara default */
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px;
            border: 1px dashed #cbd5e1;
        }

        .sub-links a {
            display: block;
            text-decoration: none;
            color: #475569;
            font-size: 13px;
            padding: 8px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .sub-links a:hover { background: #e2e8f0; color: #1e293b; }
        
        /* Class untuk menampilkan dropdown via JS */
        .show-links { display: block; animation: slideDown 0.3s ease; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .special-section { margin-top: 10px; padding-top: 20px; border-top: 2px solid #e1e8ed; }
        .btn-special {
            text-decoration: none; display: flex; align-items: center; justify-content: center;
            gap: 10px; width: 100%; padding: 18px; border-radius: 14px;
            font-weight: 600; color: white; background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
        }

        @media (max-width: 500px) {
            .menu-grid { grid-template-columns: 1fr; }
            .item-dark-blue, .sheets-wrapper, .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>Tools Teknisi Portal</h1>
            <p>Pusat Diagnostik & Informasi Perangkat</p>
        </div>

        <div class="menu-grid">
            <a href="https://monkeydredline-afk.github.io/monkeydredline.github.io/Form%20Pengecekan%20Laptop.html" class="menu-item item-dark-blue">
                <i class='bx bx-laptop'></i>
                <span>Cek Laptop Utama</span>
            </a>

            <!-- Dropdown Google Sheets -->
            <div class="sheets-wrapper">
                <div class="menu-item item-blue" onclick="toggleLinks()">
                    <i class='bx bxs-spreadsheet'></i>
                    <span>Google Sheets <i class='bx bx-chevron-down'></i></span>
                </div>
                <div id="extraLinks" class="sub-links">
                    <a href="URL_LINK_1" target="_blank"><i class='bx bx-link-alt'></i> Link Database 1</a>
                    <a href="URL_LINK_2" target="_blank"><i class='bx bx-link-alt'></i> Link Laporan Tim</a>
                    <a href="https://docs.google.com/spreadsheets/d/137LVtWZf3k825Eu9MiDBeRuaYWS7WaTBZteSMskhJVQ/edit" target="_blank"><i class='bx bx-file'></i> List Laptop  Wana Satria Komputindo</a>
                </div>
            </div>

            <a href="https://u.pcloud.link/publink/show?code=kZIPED5ZD5C4enyhjAFP9eEi6w7LrRTmpz8X" class="menu-item item-blue">
                <i class='bx bx-category-alt'></i>
                <span>Aplikasi Teknisi</span>
            </a>
            
            <a href="#" class="menu-item item-blue">
                <i class='bx bx-dollar-circle'></i>
                <span>Cek Laptop Jual</span>
            </a>
            
            <a href="#" class="menu-item item-blue">
                <i class='bx bx-chip'></i>
                <span>Cek Processor</span>
            </a>
            
            <a href="#" class="menu-item item-blue full-width" style="grid-column: span 2;">
                <i class='bx bx-task'></i>
                <span>System Requirement</span>
            </a>
        </div>

        <div class="special-section">
            <a href="#" class="btn-special">
                <i class='bx bxs-star'></i>
                <span>Lihat Produk Baru & Promo</span>
            </a>
        </div>
    </div>

    <script>
        function toggleLinks() {
            var x = document.getElementById("extraLinks");
            if (x.className.indexOf("show-links") == -1) {
                x.className += " show-links";
            } else {
                x.className = x.className.replace(" show-links", "");
            }
        }
    </script>

</body>
</html>
