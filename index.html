<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tools Teknisi v2.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        /* --- Reset & Base Style --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #f0f4f8; /* Background abu-abu sangat muda yang segar */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- Container Utama --- */
        .dashboard-container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 40px;
            border-radius: 24px; /* Sudut melengkung besar yang modern */
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); /* Shadow halus agar terlihat mengambang */
        }

        /* --- Bagian Judul --- */
        .header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #2b5dbb 0%, #3b71ed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 5px;
        }

        /* --- Grid Menu Utama --- */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 kolom di layar besar */
            gap: 20px;
            margin-bottom: 25px;
        }

        /* --- Style Tombol/Kartu (Latar Biru) --- */
        .menu-item {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            border-radius: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Gradient Biru untuk Item Utama */
        .item-blue {
            background: linear-gradient(135deg, #4481eb 0%, #04befe 100%);
            box-shadow: 0 6px 15px rgba(68, 129, 235, 0.2);
        }

        /* Item 'Gelap' pertama (seperti di gambar asli) tapi dengan gradient */
        .item-dark-blue {
            background: linear-gradient(135deg, #1a4a9c 0%, #3b71ed 100%);
            box-shadow: 0 6px 15px rgba(26, 74, 156, 0.2);
            grid-column: span 2; /* Tombol pertama full width */
        }

        /* Efek Hover untuk Biru */
        .menu-item:hover {
            transform: translateY(-5px); /* Sedikit terangkat */
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        /* --- Style Ikon --- */
        .menu-item i {
            font-size: 36px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 12px;
            transition: transform 0.3s ease;
        }

        .menu-item:hover i {
            transform: scale(1.15) rotate(-5deg); /* Ikon membesar dan sedikit miring */
            color: #ffffff;
        }

        /* --- Style Teks --- */
        .menu-item span {
            font-size: 16px;
            font-weight: 600;
            color: white;
            text-align: center;
            letter-spacing: 0.3px;
        }

        /* --- Style Tombol Spesial (Merah) --- */
        .special-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e1e8ed;
        }

        .btn-special {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .special-red {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            box-shadow: 0 6px 15px rgba(255, 65, 108, 0.3);
        }

        .special-red:hover {
            box-shadow: 0 10px 25px rgba(255, 65, 108, 0.4);
            filter: brightness(1.1);
        }

        .special-red i {
            font-size: 20px;
        }

        /* --- Responsif untuk Layar Kecil --- */
        @media (max-width: 500px) {
            .dashboard-container { padding: 25px; }
            .header h1 { font-size: 26px; }
            .menu-grid { grid-template-columns: 1fr; } /* Balik ke 1 kolom di HP */
            .item-dark-blue { grid-column: span 1; }
            .menu-item { padding: 20px; }
            .menu-item i { font-size: 30px; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>Tools Teknisi Portal</h1>
            <p>Pusat Diagnostik & Informasi Perangkat</p>
        </div>

        <div class="menu-grid">
            <a href="https://monkeydredline-afk.github.io/monkeydredline.github.io/Form%20Pengecekan%20Laptop.html" class="menu-item item-dark-blue">
                <i class='bx bx-laptop'></i>
                <span>Cek Laptop Utama</span>
            </a>

            <a href="https://u.pcloud.link/publink/show?code=kZIPED5ZD5C4enyhjAFP9eEi6w7LrRTmpz8X" class="menu-item item-blue">
                <i class='bx bx-category-alt'></i>
                <span>Aplikasi Teknisi</span>
            </a>
            
            <a href="#" class="menu-item item-blue">
                <i class='bx bx-dollar-circle'></i>
                <span>Cek Laptop Jual</span>
            </a>
            
            <a href="#" class="menu-item item-blue">
                <i class='bx bx-chip'></i>
                <span>Cek Processor</span>
            </a>
            
            <a href="#" class="menu-item item-blue">
                <i class='bx bx-task'></i>
                <span>System Requirement</span>
            </a>
        </div>

        <div class="special-section">
            <a href="#" class="btn-special special-red">
                <i class='bx bxs-star'></i>
                <span>Lihat Produk Baru & Promo</span>
            </a>
        </div>
    </div>

</body>
</html>
